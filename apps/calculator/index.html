<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script>if (window.self !== window.top) document.documentElement.classList.add("embedded");</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass-edge:rgba(255,255,255,.55); --glass-shadow:rgba(180,60,120,.18);
    --screen:rgba(255,255,255,.42); --screen-text:#7a1f4a; --screen-dim:#b0668a;
    --key:rgba(255,255,255,.28); --key-text:#7a1f4a;
    --fn:rgba(255,220,235,.30);
    --mode:rgba(255,255,255,.22); --mode-on:rgba(233,78,143,.75);
    --op:rgba(255,134,184,.45); --op-text:#fff;
    --eq:rgba(226,64,127,.65);
    --ac:rgba(255,111,159,.50);
    --alt:#c2306f;
    --error:#d6194f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#ffeef6 0%,#f3e8ff 50%,#e6f4ff 100%);
    color:var(--key-text);
    display:flex;justify-content:center;align-items:flex-start;
    padding:32px 16px;min-height:100vh;overflow-x:hidden;position:relative;
  }

  /* ---------- floating background ---------- */
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.65;animation:drift 22s ease-in-out infinite alternate}
  .blob.b1{width:380px;height:380px;background:#ffb3d1;top:-80px;left:-60px}
  .blob.b2{width:320px;height:320px;background:#c9b6ff;bottom:-60px;right:-40px;animation-duration:26s;animation-delay:-6s}
  .blob.b3{width:260px;height:260px;background:#a8dcff;top:40%;left:55%;animation-duration:30s;animation-delay:-12s}
  .blob.b4{width:220px;height:220px;background:#ffd6a8;top:60%;left:5%;animation-duration:24s;animation-delay:-3s;opacity:.45}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(12vw,8vh) scale(1.15)}
    100%{transform:translate(-6vw,14vh) scale(.9)}
  }
  .bubble{
    position:absolute;bottom:-80px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 40%,rgba(255,182,213,.12) 70%,rgba(255,255,255,.35));
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 0 10px rgba(255,255,255,.5),0 4px 12px rgba(214,51,132,.08);
    animation:rise linear infinite;
  }
  .petal{position:absolute;top:-40px;color:rgba(255,140,190,.75);text-shadow:0 0 6px rgba(255,255,255,.8);animation:fall linear infinite}
  @keyframes rise{
    0%{transform:translate(0,0) scale(.8);opacity:0}
    10%{opacity:1}
    50%{transform:translate(var(--sway),-55vh) scale(1)}
    90%{opacity:1}
    100%{transform:translate(calc(var(--sway) * -1),-115vh) scale(1.1);opacity:0}
  }
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0);opacity:0}
    10%{opacity:1}
    50%{transform:translate(var(--sway),55vh) rotate(180deg)}
    90%{opacity:1}
    100%{transform:translate(calc(var(--sway) * -1),115vh) rotate(360deg);opacity:0}
  }

  .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:820px;position:relative;z-index:1}

  /* glass panels float gently */
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  /* ---------- calculator body ---------- */
  .calc{
    width:100%;max-width:400px;
    background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.12));
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-edge);
    border-radius:32px;padding:20px 18px 22px;
    box-shadow:0 20px 50px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.7);
    position:relative;animation:hover 6s ease-in-out infinite;
  }
  .brand{display:flex;justify-content:space-between;align-items:center;padding:0 6px 10px;color:#b3326f;
    text-shadow:0 1px 0 rgba(255,255,255,.7);font-weight:700;letter-spacing:.5px}
  .brand .name{font-size:18px}
  .brand .model{font-size:12px;opacity:.85}
  .brand .heart{font-size:16px}

  .screen{
    background:var(--screen);border-radius:18px;padding:10px 14px 12px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.7);
    box-shadow:inset 0 2px 10px rgba(214,51,132,.10);
    font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;color:var(--screen-text);
  }
  .status{display:flex;gap:10px;font-size:11px;font-weight:700;height:16px;color:var(--screen-dim)}
  .status span{opacity:.25;transition:opacity .15s}
  .status span.on{opacity:1;color:#e94e8f}
  .expr{
    min-height:28px;font-size:18px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;
    margin-top:6px;scrollbar-width:thin;direction:ltr;
  }
  .expr .ghost{color:var(--screen-dim);opacity:.6}
  .expr .ph{color:var(--screen-dim);opacity:.5}
  .result{
    text-align:right;font-size:34px;font-weight:700;min-height:46px;line-height:46px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .result.preview{color:var(--screen-dim);font-weight:500}
  .result.error{color:var(--error);font-size:26px}

  /* ---------- keys ---------- */
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .keys button{
    font-family:inherit;font-weight:700;font-size:18px;color:var(--key-text);
    background:var(--key);border:1px solid rgba(255,255,255,.6);border-radius:14px;height:48px;cursor:pointer;
    box-shadow:0 4px 12px rgba(214,51,132,.10), inset 0 1px 0 rgba(255,255,255,.8);
    transition:transform .08s, box-shadow .08s, background .15s;
    position:relative;user-select:none;-webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  }
  .keys button sup{font-size:.6em;line-height:0}
  .keys button .alt{position:absolute;top:3px;left:0;right:0;font-size:9.5px;font-weight:700;color:var(--alt);opacity:.75;pointer-events:none}
  .keys button .alt sup{font-size:.75em}
  .keys button:hover{background:rgba(255,255,255,.45);transform:translateY(-1px)}
  .keys button:active,.keys button.press{transform:translateY(2px) scale(.97);box-shadow:0 1px 4px rgba(214,51,132,.12), inset 0 1px 0 rgba(255,255,255,.6)}
  .keys button:focus-visible{outline:3px solid #fff;outline-offset:2px}

  .keys .fn{background:var(--fn);font-size:16px;padding-top:8px}
  .keys .mode{background:var(--mode);font-size:14px}
  .keys .mode.on{background:var(--mode-on);color:#fff}
  .keys .op{background:var(--op);color:var(--op-text);font-size:22px;text-shadow:0 1px 2px rgba(169,37,96,.35)}
  .keys .eq{background:var(--eq);color:#fff;font-size:24px;text-shadow:0 1px 2px rgba(169,37,96,.4)}
  .keys .ac,.keys .del{background:var(--ac);color:#fff;text-shadow:0 1px 2px rgba(169,37,96,.35)}
  .keys .op:hover{background:rgba(255,134,184,.6)}
  .keys .eq:hover{background:rgba(226,64,127,.8)}
  .keys .ac:hover,.keys .del:hover{background:rgba(255,111,159,.65)}
  .keys .num{font-size:20px}
  .shifted .keys button[data-has2] .main{opacity:.45}
  .shifted .keys button[data-has2] .alt{opacity:1;color:#e94e8f}

  .hint{margin-top:14px;text-align:center;font-size:12px;color:#a8336b;opacity:.8}

  /* ---------- history ---------- */
  .history{
    width:100%;max-width:300px;
    background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.12));
    border:1px solid var(--glass-edge);border-radius:24px;padding:16px;
    box-shadow:0 16px 40px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    animation:hover 7s ease-in-out infinite;animation-delay:-2.5s;
  }
  .history h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .history h2 button{font-family:inherit;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.6);background:var(--fn);color:var(--key-text);border-radius:999px;padding:4px 10px;cursor:pointer}
  .history ul{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
  .history li{padding:8px 10px;border-radius:12px;cursor:pointer;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;word-break:break-all;transition:background .15s}
  .history li:hover{background:rgba(255,255,255,.4)}
  .history li .h-expr{font-size:13px;color:var(--screen-dim)}
  .history li .h-res{font-size:17px;font-weight:700;color:var(--screen-text);text-align:right}
  .history .empty{color:var(--screen-dim);font-size:13px;text-align:center;padding:20px 0}

  @media (max-width:420px){
    body{padding:16px}
    .calc{padding:16px 12px 18px;border-radius:26px}
    .keys{gap:8px}
    .keys button{height:44px;font-size:16px}
    .keys .fn{font-size:14px}
    .result{font-size:28px}
  }
  @media (prefers-reduced-motion:reduce){
    .blob,.calc,.history{animation:none!important}
    .bubble,.petal{display:none}
  }

  /* ---------- embedded in desktop window ---------- */
  html.embedded,html.embedded body{min-height:0!important}
  html.embedded body{background:transparent;padding:22px 16px;align-items:flex-start}
  html.embedded .sky{display:none}
  html.embedded .calc,html.embedded .history{animation:none}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<div class="wrap">
  <div class="calc" id="calc">
    <div class="brand">
      <span class="name">✿ Sakura Calc</span>
      <span class="model">SCIENTIFIC · fx-PINK <span class="heart">♥</span></span>
    </div>
    <div class="screen">
      <div class="status">
        <span id="st-2nd">2nd</span>
        <span id="st-hyp">HYP</span>
        <span id="st-deg" class="on">DEG</span>
        <span id="st-rad">RAD</span>
        <span id="st-m">M</span>
      </div>
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys" id="keys"></div>
    <div class="hint">ใช้คีย์บอร์ดได้: 0-9 + − * / ^ ( ) ! % · Enter = · Backspace ลบ · Esc ล้าง</div>
  </div>

  <div class="history">
    <h2>ประวัติการคำนวณ <button id="clearHist" type="button">ล้าง</button></h2>
    <ul id="hist"></ul>
  </div>
</div>

<script>
// floating bubbles & petals
(() => {
  const sky = document.getElementById('sky');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const glyphs = ['✿', '❀', '♥', '✦'];
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('span');
    b.className = 'bubble';
    const size = rnd(14, 60);
    Object.assign(b.style, {
      width: size + 'px', height: size + 'px', left: rnd(0, 100) + 'vw',
      animationDuration: rnd(14, 30) + 's', animationDelay: -rnd(0, 30) + 's'
    });
    b.style.setProperty('--sway', rnd(-80, 80) + 'px');
    sky.appendChild(b);
  }
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = glyphs[i % glyphs.length];
    Object.assign(p.style, {
      left: rnd(0, 100) + 'vw', fontSize: rnd(12, 24) + 'px',
      animationDuration: rnd(16, 32) + 's', animationDelay: -rnd(0, 32) + 's'
    });
    p.style.setProperty('--sway', rnd(-120, 120) + 'px');
    sky.appendChild(p);
  }
})();
</script>
<script>
(() => {
  // ---------------- state ----------------
  let tokens = [];        // display tokens
  let ans = 0;            // last answer
  let memory = 0;
  let deg = true;
  let second = false;
  let hyp = false;
  let justEval = false;
  let history = [];

  const exprEl = document.getElementById('expr');
  const resEl  = document.getElementById('result');
  const keysEl = document.getElementById('keys');
  const calcEl = document.getElementById('calc');
  const histEl = document.getElementById('hist');

  // ---------------- math helpers ----------------
  const toRad = x => deg ? x * Math.PI / 180 : x;
  const fromRad = x => deg ? x * 180 / Math.PI : x;

  function trig(fn, x) {
    if (fn === 'tan') {
      const period = deg ? 180 : Math.PI;
      const half = period / 2;
      const m = ((x % period) + period) % period;
      if (Math.abs(m - half) < 1e-12) return NaN;
    }
    let r = Math[fn](toRad(x));
    if (Math.abs(r) < 1e-13) r = 0;
    return r;
  }

  function gamma(z) {
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
    const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028,
      771.32342877765313, -176.61502916214059, 12.507343278686905,
      -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    z -= 1;
    let x = c[0];
    for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
    const t = z + g + 0.5;
    return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
  }

  function factorial(n) {
    if (Number.isInteger(n)) {
      if (n < 0) return NaN;
      if (n > 170) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }
    return gamma(n + 1);
  }

  const FN = {
    sin: x => trig('sin', x), cos: x => trig('cos', x), tan: x => trig('tan', x),
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    ln: Math.log, log: Math.log10, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs
  };

  // display token -> function name
  const FTOK = { 'ln(': 'ln', 'log(': 'log', '√(': 'sqrt', '∛(': 'cbrt', 'abs(': 'abs' };
  for (const f of ['sin', 'cos', 'tan']) {
    FTOK[f + '('] = f;
    FTOK[f + '⁻¹('] = 'a' + f;
    FTOK[f + 'h('] = f + 'h';
    FTOK[f + 'h⁻¹('] = 'a' + f + 'h';
  }

  class CalcError extends Error {}
  const SYNTAX = () => new CalcError('Syntax Error');

  // ---------------- lexer ----------------
  function lex(toks) {
    const out = [];
    let i = 0;
    const isDigit = t => /^[0-9.]$/.test(t);
    while (i < toks.length) {
      const t = toks[i];
      if (isDigit(t)) {
        let s = '';
        while (i < toks.length && isDigit(toks[i])) s += toks[i++];
        if ((s.match(/\./g) || []).length > 1 || s === '.') throw SYNTAX();
        if (toks[i] === 'E') {
          i++;
          let e = '';
          if (toks[i] === '−' || toks[i] === '+') { e += toks[i] === '−' ? '-' : '+'; i++; }
          let d = '';
          while (i < toks.length && /^[0-9]$/.test(toks[i])) d += toks[i++];
          if (!d) throw SYNTAX();
          s += 'e' + e + d;
        }
        out.push({ type: 'num', v: Number(s) });
        continue;
      }
      i++;
      if (['+', '−', '×', '÷', '^'].includes(t)) out.push({ type: 'op', v: t });
      else if (t === '(') out.push({ type: 'lp' });
      else if (t === ')') out.push({ type: 'rp' });
      else if (['!', '%', '²', '³', '⁻¹'].includes(t)) out.push({ type: 'post', v: t });
      else if (t === 'π') out.push({ type: 'num', v: Math.PI });
      else if (t === 'e') out.push({ type: 'num', v: Math.E });
      else if (t === 'Ans') out.push({ type: 'num', v: ans });
      else if (t === 'M') out.push({ type: 'num', v: memory });
      else if (t === 'Ran#') out.push({ type: 'num', v: Math.random() });
      else if (t === 'e^(') out.push({ type: 'num', v: Math.E }, { type: 'op', v: '^' }, { type: 'lp' });
      else if (t === '10^(') out.push({ type: 'num', v: 10 }, { type: 'op', v: '^' }, { type: 'lp' });
      else if (t === '^(1÷') out.push({ type: 'op', v: '^' }, { type: 'lp' }, { type: 'num', v: 1 }, { type: 'op', v: '÷' });
      else if (FTOK[t]) out.push({ type: 'func', v: FTOK[t] });
      else throw SYNTAX();
    }
    return out;
  }

  // ---------------- parser (recursive descent) ----------------
  function parse(lx) {
    let i = 0;
    const peek = () => lx[i];
    const startsPrimary = t => t && (t.type === 'num' || t.type === 'func' || t.type === 'lp');

    function expr() {
      let v = term();
      while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '−')) {
        const o = lx[i++].v;
        const r = term();
        v = o === '+' ? v + r : v - r;
      }
      return v;
    }
    function term() {
      let v = unary();
      for (;;) {
        const t = peek();
        if (t && t.type === 'op' && (t.v === '×' || t.v === '÷')) {
          i++;
          const r = unary();
          v = t.v === '×' ? v * r : v / r;
        } else if (startsPrimary(t)) {
          v = v * power();            // implicit multiplication: 2π, 3sin(30), (2)(3)
        } else break;
      }
      return v;
    }
    function unary() {
      const t = peek();
      if (t && t.type === 'op' && (t.v === '−' || t.v === '+')) {
        i++;
        const v = unary();
        return t.v === '−' ? -v : v;
      }
      return power();
    }
    function power() {
      const b = postfix();
      const t = peek();
      if (t && t.type === 'op' && t.v === '^') {
        i++;
        return Math.pow(b, unary());   // right-associative
      }
      return b;
    }
    function postfix() {
      let v = primary();
      while (peek() && peek().type === 'post') {
        const p = lx[i++].v;
        if (p === '!') v = factorial(v);
        else if (p === '%') v = v / 100;
        else if (p === '²') v = v * v;
        else if (p === '³') v = v * v * v;
        else if (p === '⁻¹') v = 1 / v;
      }
      return v;
    }
    function closeParen() {
      const t = peek();
      if (t && t.type === 'rp') i++;
      else if (t) throw SYNTAX();      // auto-close only at end of input
    }
    function primary() {
      const t = lx[i++];
      if (!t) throw SYNTAX();
      if (t.type === 'num') return t.v;
      if (t.type === 'lp') { const v = expr(); closeParen(); return v; }
      if (t.type === 'func') { const v = expr(); closeParen(); return FN[t.v](v); }
      throw SYNTAX();
    }

    const v = expr();
    if (i < lx.length) throw SYNTAX();
    return v;
  }

  function compute(toks) {
    const lx = lex(toks);
    if (!lx.length) return 0;
    const v = parse(lx);
    if (typeof v !== 'number' || !isFinite(v)) throw new CalcError('Math Error');
    return v;
  }

  function fmt(x) {
    if (x === 0 || Object.is(x, -0)) return '0';
    const a = Math.abs(x);
    if (a >= 1e12 || a < 1e-9) {
      let [m, e] = x.toExponential(9).split('e');
      if (m.includes('.')) m = m.replace(/0+$/, '').replace(/\.$/, '');
      return m + 'E' + (+e);
    }
    return String(parseFloat(x.toPrecision(12)));
  }

  // ---------------- keys ----------------
  const trigLabel = f => {
    const base = f + (hyp ? 'h' : '');
    return { main: base, alt: base + '<sup>−1</sup>' };
  };
  const DEF = {
    '2nd': { l: '2nd', c: 'mode' },
    drg:   { l: () => deg ? 'DEG' : 'RAD', c: 'mode' },
    hyp:   { l: 'hyp', c: 'mode' },
    mplus: { l: 'M+', l2: 'M−', c: 'fn' },
    mr:    { l: 'MR', l2: 'MC', c: 'fn' },
    sin:   { l: () => trigLabel('sin').main, l2: () => trigLabel('sin').alt, c: 'fn' },
    cos:   { l: () => trigLabel('cos').main, l2: () => trigLabel('cos').alt, c: 'fn' },
    tan:   { l: () => trigLabel('tan').main, l2: () => trigLabel('tan').alt, c: 'fn' },
    ln:    { l: 'ln', l2: 'e<sup>x</sup>', c: 'fn' },
    log:   { l: 'log', l2: '10<sup>x</sup>', c: 'fn' },
    sq:    { l: 'x<sup>2</sup>', l2: 'x<sup>3</sup>', c: 'fn' },
    pow:   { l: 'x<sup>y</sup>', l2: '<sup>y</sup>√x', c: 'fn' },
    sqrt:  { l: '√', l2: '∛', c: 'fn' },
    inv:   { l: 'x<sup>−1</sup>', l2: '|x|', c: 'fn' },
    fact:  { l: 'n!', l2: 'Ran#', c: 'fn' },
    pi:    { l: 'π', c: 'fn' },
    e:     { l: 'e', c: 'fn' },
    lp:    { l: '(', c: 'fn' },
    rp:    { l: ')', c: 'fn' },
    pct:   { l: '%', c: 'fn' },
    del:   { l: '⌫', c: 'del' },
    ac:    { l: 'AC', c: 'ac' },
    mul:   { l: '×', c: 'op' },
    div:   { l: '÷', c: 'op' },
    add:   { l: '+', c: 'op' },
    sub:   { l: '−', c: 'op' },
    dot:   { l: '.', c: 'num' },
    exp:   { l: 'EXP', c: 'num' },
    ans:   { l: 'Ans', c: 'num' },
    eq:    { l: '=', c: 'eq' }
  };
  for (let d = 0; d <= 9; d++) DEF[String(d)] = { l: String(d), c: 'num' };

  const LAYOUT = [
    '2nd', 'drg', 'hyp', 'mplus', 'mr',
    'sin', 'cos', 'tan', 'ln', 'log',
    'sq', 'pow', 'sqrt', 'inv', 'fact',
    'pi', 'e', 'lp', 'rp', 'pct',
    '7', '8', '9', 'del', 'ac',
    '4', '5', '6', 'mul', 'div',
    '1', '2', '3', 'add', 'sub',
    '0', 'dot', 'exp', 'ans', 'eq'
  ];

  const btns = {};
  const val = v => typeof v === 'function' ? v() : v;
  for (const id of LAYOUT) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = DEF[id].c;
    b.dataset.id = id;
    if (DEF[id].l2) b.dataset.has2 = '1';
    b.addEventListener('click', () => press(id));
    keysEl.appendChild(b);
    btns[id] = b;
  }

  function renderKeys() {
    for (const id of LAYOUT) {
      const d = DEF[id], b = btns[id];
      const main = `<span class="main">${val(d.l)}</span>`;
      b.innerHTML = d.l2 ? `<span class="alt">${val(d.l2)}</span>${main}` : main;
    }
    btns['2nd'].classList.toggle('on', second);
    btns.hyp.classList.toggle('on', hyp);
    calcEl.classList.toggle('shifted', second);
  }

  // ---------------- input actions ----------------
  const CONTINUE_WITH_ANS = ['+', '−', '×', '÷', '^', '!', '%', '²', '³', '⁻¹', '^(1÷'];
  let errorMsg = '';

  function insert(tok) {
    if (justEval) {
      tokens = CONTINUE_WITH_ANS.includes(tok) ? ['Ans'] : [];
      justEval = false;
    }
    tokens.push(tok);
  }

  function currentValue() {
    if (justEval) return ans;
    return tokens.length ? compute(tokens) : 0;
  }

  function evaluate() {
    if (!tokens.length) return;
    const shown = tokens.join('');
    const v = compute(tokens);
    ans = v;
    justEval = true;
    history.unshift({ toks: tokens.slice(), expr: shown, res: fmt(v) });
    if (history.length > 30) history.pop();
    renderHistory();
  }

  function press(id) {
    errorMsg = '';
    try {
      switch (id) {
        case '2nd': second = !second; renderAll(); return;
        case 'drg': deg = !deg; break;
        case 'hyp': hyp = !hyp; renderAll(); return;
        case 'sin': case 'cos': case 'tan':
          insert(id + (hyp ? 'h' : '') + (second ? '⁻¹' : '') + '(');
          hyp = false;
          break;
        case 'ln':   insert(second ? 'e^(' : 'ln('); break;
        case 'log':  insert(second ? '10^(' : 'log('); break;
        case 'sq':   insert(second ? '³' : '²'); break;
        case 'pow':  insert(second ? '^(1÷' : '^'); break;
        case 'sqrt': insert(second ? '∛(' : '√('); break;
        case 'inv':  insert(second ? 'abs(' : '⁻¹'); break;
        case 'fact': insert(second ? 'Ran#' : '!'); break;
        case 'pi':   insert('π'); break;
        case 'e':    insert('e'); break;
        case 'lp':   insert('('); break;
        case 'rp':   insert(')'); break;
        case 'pct':  insert('%'); break;
        case 'mul':  insert('×'); break;
        case 'div':  insert('÷'); break;
        case 'add':  insert('+'); break;
        case 'sub':  insert('−'); break;
        case 'dot':  insert('.'); break;
        case 'exp':  insert('E'); break;
        case 'ans':  insert('Ans'); break;
        case 'mplus': {
          const v = currentValue();
          memory = second ? memory - v : memory + v;
          break;
        }
        case 'mr':
          if (second) memory = 0; else insert('M');
          break;
        case 'del':
          if (justEval) { justEval = false; }
          else tokens.pop();
          break;
        case 'ac':
          tokens = []; justEval = false;
          break;
        case 'eq':
          evaluate();
          break;
        default:
          if (/^[0-9]$/.test(id)) insert(id);
      }
    } catch (err) {
      errorMsg = err instanceof CalcError ? err.message : 'Error';
    }
    second = false;
    renderAll();
  }

  // ---------------- rendering ----------------
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function renderScreen() {
    const str = tokens.join('');
    const open = (str.match(/\(/g) || []).length - (str.match(/\)/g) || []).length;
    exprEl.innerHTML = str
      ? esc(str) + (open > 0 ? `<span class="ghost">${')'.repeat(open)}</span>` : '')
      : '<span class="ph">0</span>';
    exprEl.scrollLeft = exprEl.scrollWidth;

    resEl.className = 'result';
    let text;
    if (errorMsg) {
      text = errorMsg; resEl.classList.add('error');
    } else if (justEval) {
      text = fmt(ans);
    } else if (!tokens.length) {
      text = '0'; resEl.classList.add('preview');
    } else {
      try {
        text = tokens.includes('Ran#') ? '' : fmt(compute(tokens));
      } catch { text = ''; }
      resEl.classList.add('preview');
    }
    resEl.textContent = text;
    resEl.style.fontSize = text.length > 16 ? '22px' : text.length > 12 ? '28px' : '';

    document.getElementById('st-2nd').classList.toggle('on', second);
    document.getElementById('st-hyp').classList.toggle('on', hyp);
    document.getElementById('st-deg').classList.toggle('on', deg);
    document.getElementById('st-rad').classList.toggle('on', !deg);
    document.getElementById('st-m').classList.toggle('on', memory !== 0);
  }

  function renderHistory() {
    if (!history.length) {
      histEl.innerHTML = '<li class="empty">ยังไม่มีประวัติ ♡</li>';
      return;
    }
    histEl.innerHTML = '';
    history.forEach(h => {
      const li = document.createElement('li');
      li.innerHTML = `<div class="h-expr">${esc(h.expr)} =</div><div class="h-res">${esc(h.res)}</div>`;
      li.title = 'คลิกเพื่อนำนิพจน์กลับมาแก้ไข';
      li.addEventListener('click', () => {
        tokens = h.toks.slice(); justEval = false; errorMsg = '';
        renderAll();
      });
      histEl.appendChild(li);
    });
  }

  function renderAll() { renderKeys(); renderScreen(); }

  document.getElementById('clearHist').addEventListener('click', () => { history = []; renderHistory(); });

  // ---------------- keyboard ----------------
  const KEYMAP = {
    '+': 'add', '-': 'sub', '*': 'mul', 'x': 'mul', '/': 'div', '.': 'dot', ',': 'dot',
    '(': 'lp', ')': 'rp', '%': 'pct', '!': 'fact', 'Enter': 'eq', '=': 'eq',
    'Backspace': 'del', 'Escape': 'ac', 'Delete': 'ac',
    'p': 'pi', 'e': 'e', 's': 'sin', 'c': 'cos', 't': 'tan', 'l': 'ln', 'g': 'log', 'r': 'sqrt'
  };
  document.addEventListener('keydown', ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    let id = null;
    if (/^[0-9]$/.test(ev.key)) id = ev.key;
    else if (ev.key === '^') { id = 'pow'; second = false; }
    else id = KEYMAP[ev.key];
    if (!id) return;
    ev.preventDefault();
    if (id === 'fact') second = false;
    const b = btns[id];
    if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); }
    press(id);
  });

  renderAll();
  renderHistory();
})();
</script>
<script>
// embedded: tell the desktop how tall the content is, and accept a zoom-to-fit
(() => {
  if (window.self === window.top) return;
  addEventListener('message', e => {
    if (e.data && e.data.type === 'zoom' && e.data.z > 0) document.documentElement.style.zoom = e.data.z;
  });
  addEventListener('load', async () => {
    try { await document.fonts.ready; } catch {}
    requestAnimationFrame(() => requestAnimationFrame(() => {
      parent.postMessage({ type: 'app-size', h: Math.ceil(document.body.scrollHeight) }, '*');
    }));
  });
})();
</script>
</body>
